<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>开始定制 | BIGBROSTUDIO</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="order.css">
    <!-- PayPal SDK -->
    <script src="https://www.paypal.com/sdk/js?client-id=AT9bM0e8mHh6d_x830mU_YVvF4WcR-y47iL5XQnXZuF9Q2oJ2TzP6xGz6dE9Xp8M0e8mHh6d_x830mU_Y&currency=USD"></script>
</head>
<body>
    <header class="site-header">
        <div class="container header-container" style="text-align: center; padding: 20px 0;">
            <a href="index.html" style="text-decoration: none;">
                <span class="logo-text" style="font-size: 2rem; font-weight: 900; color: #2D3436; letter-spacing: -1px;">BIGBROSTUDIO</span>
            </a>
        </div>
    </header>

    <section class="order-section">
        <div class="container">
            <div class="order-box" id="upload-wizard">
                <!-- Wizard Progress -->
                <div class="wizard-progress">
                    <div class="step active" data-step="1">1. 上传照片</div>
                    <div class="step" data-step="2">2. 定制选项</div>
                    <div class="step" data-step="3">3. 结账</div>
                    <div class="step" data-step="4">4. 付款</div>
                </div>

                <!-- STEP 1: UPLOAD -->
                <div class="wizard-step active" id="step-1">
                    <h2>上传爱宠照片</h2>
                    <p class="subtitle">将清晰的照片拖拽到此处，或点击浏览。</p>
                    
                    <div class="drop-zone" id="drop-zone">
                        <div class="drop-icon">📸</div>
                        <p>拖拽照片到此处</p>
                        <p class="or">或</p>
                        <button id="browse-btn" class="btn-secondary">浏览文件</button>
                        <input type="file" id="file-input" accept="image/jpeg, image/png, image/webp" style="display: none;">
                    </div>
                    
                    <div class="guidelines">
                        <div class="guide-grid">
                            <div class="guide-good">
                                <h5>✅ 什么样的照片最好：</h5>
                                <ul>
                                    <li>清晰、光线充足的照片</li>
                                    <li>宠物的脸部完整可见</li>
                                    <li>与宠物平视角度拍摄</li>
                                </ul>
                            </div>
                            <div class="guide-bad">
                                <h5>❌ 避免以下情况：</h5>
                                <ul>
                                    <li>模糊或昏暗的照片</li>
                                    <li>耳朵或头部被裁切</li>
                                    <li>宠物距离镜头太远</li>
                                </ul>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- STEP 2: EDIT & STYLE -->
                <div class="wizard-step" id="step-2">
                    <h2>选择画风主题</h2>
                    
                    <div class="preview-container">
                        <img id="image-preview" src="" alt="Preview">
                    </div>

                    <div class="style-grid">
                        <label class="style-card">
                            <input type="radio" name="art_style" value="皇家贵族 Renaissance" checked>
                            <img src="https://images.unsplash.com/photo-1583337130417-3346a1be7dee?auto=format&fit=crop&w=300&q=80" alt="皇家贵族">
                            <div class="style-name">皇家贵族</div>
                        </label>
                        <label class="style-card">
                            <input type="radio" name="art_style" value="Disney 卡通动漫">
                            <img src="https://images.unsplash.com/photo-1517849845537-4d257902454a?auto=format&fit=crop&w=300&q=80" alt="卡通动漫">
                            <div class="style-name">卡通动漫</div>
                        </label>
                        <label class="style-card">
                            <input type="radio" name="art_style" value="Classic 唯美水彩">
                            <img src="https://images.unsplash.com/photo-1543466835-00a7907e9de1?auto=format&fit=crop&w=300&q=80" alt="唯美水彩">
                            <div class="style-name">唯美水彩</div>
                        </label>
                    </div>
                    
                    <div class="wizard-actions">
                        <button class="btn-outline prev-step">返回上一步</button>
                        <button class="btn-primary next-step">保存并下一步</button>
                    </div>
                </div>

                <!-- STEP 3: CART -->
                <div class="wizard-step" id="step-3">
                    <h2>核对您的订单</h2>
                    <div class="cart-container">
                        <table class="cart-table">
                            <thead>
                                <tr>
                                    <th>商品明细</th>
                                    <th>价格</th>
                                    <th></th>
                                </tr>
                            </thead>
                            <tbody id="cart-table-body"></tbody>
                        </table>
                        <div class="cart-summary">
                            <div class="cart-total-row">
                                <span>总计：</span>
                                <span id="cart-total">$0.00</span>
                            </div>
                        </div>
                    </div>
                    <div class="wizard-actions">
                        <button class="btn-outline" onclick="document.getElementById('file-input').click()">再添加一只宠物</button>
                        <button class="btn-primary next-step">安全结账</button>
                    </div>
                </div>

                <!-- STEP 4: PAYPAL -->
                <div class="wizard-step" id="step-4">
                    <h2>安全支付</h2>
                    <p class="subtitle">您正在购买个性化数码宠物画像定制服务。</p>
                    <div class="payment-container">
                        <div id="paypal-button-container"></div>
                    </div>
                    <div class="wizard-actions">
                        <button class="btn-outline prev-step">返回购物车</button>
                    </div>
                </div>

            </div>
        </div>
    </section>

    <footer class="site-footer">
        <div class="container" style="text-align: center; padding: 40px 0; color: #666;">
            <p>&copy; 2026 BIGBROSTUDIO. 保留所有权利。</p>
        </div>
    </footer>

    <script src="script.js"></script>
    <script src="i18n.js"></script>
</body>
</html>
